name: Solar System App CICD Workflow

### Trigger on branch
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

### Environment variables from Github secrets/variables
env:
  MONGO_URI: ${{ vars.MONGO_URI }}
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
  NAMESPACE: development
  REPLICAS: 1
  INGRESS_IP: ${{ vars.INGRESS_IP }}

jobs:

 ### Unit Testing and uploading the artifact with Matrix testing on different node.js version and OS 
  unit-testing:
    name: Unit Testing
    runs-on: ${{ matrix.operating_system }}
   
    strategy:
      matrix:
        #nodejs_version: [18, 20]
        #operating_system: [ubuntu-latest, macos-latest]
        nodejs_version: [18]
        operating_system: [ubuntu-latest]
        exclude:
          - nodejs_version: 18
            operating_system: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJs version - ${{ matrix.nodejs_version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.nodejs_version }}

      - name: Cache NPM Dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-unit-node-${{ matrix.nodejs_version }}-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-unit-node-${{ matrix.nodejs_version }}-modules-
            ${{ runner.os }}-unit-node-

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        id: nodejs-unit-testing-step
        run: npm test

      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mocha-Test-Result-${{ matrix.nodejs_version }}-${{ matrix.operating_system }}
          path: test-results.xml
          retention-days: 5

### Code-coverage and uploading the artifact
  code-coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJs version - 18
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Cache NPM Dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-coverage-node-18-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-coverage-node-18-modules-
            ${{ runner.os }}-coverage-node-

      - name: Install Dependencies
        run: npm install

      - name: Check Code Coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive Test Result
        uses: actions/upload-artifact@v4
        with:
          name: Code-Coverage-Result
          path: coverage
          retention-days: 5


### Login Docker, Build, Test and Push Image

  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{github.sha}}

      - name: Docker Image Testing
        run: |
          docker images
          docker run --name solar-system-app -d \
              -p 3000:3000 \
              -e MONGO_URI=$MONGO_URI \
              -e MONGO_USERNAME=$MONGO_USERNAME \
              -e MONGO_PASSWORD=$MONGO_PASSWORD \
              ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{github.sha}}

          echo Testing Image URL using wget
          wget -q -O - 127.0.0.1:3000/live | grep live


      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{github.sha}}

### Deploy to AKS Dev Cluster
  aks-deploy-dev:
    name: Deploy to AKS
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.33.0'

      - name: Configure kubeconfig
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{secrets.KUBECONFIG}}

      - name: Install ingress-nginx controller
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.14.0/deploy/static/provider/cloud/deploy.yaml
          kubectl wait \
            --namespace ingress-nginx \
            --for=condition=Available deployment/ingress-nginx-controller \
            --timeout=300s

      - name: Get ingress controller external IP
        run: |
          for i in {1..30}; do
            INGRESS_IP=$(kubectl get svc ingress-nginx-controller \
              --namespace ingress-nginx \
              -o jsonpath='{.status.loadBalancer.ingress[0].ip}')

            if [ -n "$INGRESS_IP" ]; then
              echo "INGRESS_IP=$INGRESS_IP" >> "$GITHUB_ENV"
              echo "Ingress controller IP: $INGRESS_IP"
              exit 0
            fi

            echo "Waiting for ingress external IP..."
            sleep 10
          done

          echo "Ingress controller external IP was not assigned in time."
          exit 1
      
  
      - name: Replace Placeholder in K8s Manifest files
        uses: cschleiden/replace-tokens@v1
        with:
          tokenPrefix: '_{_'
          tokenSuffix: '_}_'
          files: '["kubernetes/development/*.yaml"]'
        env:
          NAMESPACE: ${{ env.NAMESPACE }}
          REPLICAS: ${{ env.REPLICAS }}
          K8S_IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/solar-system:${{ github.sha }}
          INGRESS_IP: ${{ env.INGRESS_IP }}

      - name: Replace Placeholder Verification
        run: |
          cat kubernetes/development/*.yaml
          
